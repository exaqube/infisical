# Fork CI/CD: build the standalone Infisical image and publish it to this
# repository's GitHub Container Registry (ghcr.io/exaqube/infisical).
#
# This is the only workflow in the fork. The upstream workflows (Docker Hub
# releases, Helm, Chromatic, BDD suites, PR-title bots) need upstream secrets
# and infrastructure, so they were removed.
#
# - pull_request: build only (no push), so a broken Dockerfile fails the PR.
# - push to main: publish :main and :sha-<short>.
# - tag v*: publish :<tag> and :latest.
name: Build and push image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standalone-infisical
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INFISICAL_PLATFORM_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
